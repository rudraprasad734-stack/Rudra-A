<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UPSC Companion</title>
<meta name="description" content="A daily-use companion to the 18-month UPSC prep plan">
<meta name="theme-color" content="#1F2A52">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UPSC Companion">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#F9FAFB; --surface:#FFFFFF; --surface-2:#F4F5FA; --raised:#FFFFFF;
    --ink:#000000; --ink-soft:#333333; --ink-faint:#666666;
    --line:#CCCCCC; --line-soft:#E6E6E6;
    --navy:#1F2A52; --navy-ink:#FFFFFF; --navy-soft:#E7E9F5;
    --gold:#FF9500; --gold-ink:#FFFFFF; --gold-soft:#FFE4CC;
    --sage:#00C853; --sage-ink:#FFFFFF; --sage-soft:#C8E6C9;
    --brick:#FF3B30; --brick-ink:#FFFFFF; --brick-soft:#FFCCCB;
    --tier4:#7C3AED; --tier4-soft:#EDE9FE; --link:#0066FF;
    --freq1:#FF3B30; --freq1-soft:#FFE5E5;
    --freq2:#FF9500; --freq2-soft:#FFE4CC;
    --freq3:#FFCC00; --freq3-soft:#FFEDD4;
    --freq4:#34C759; --freq4-soft:#D1F4D7;
    --tab-dashboard:#0066FF; --tab-dashboard-ink:#FFFFFF; --tab-dashboard-soft:#E3EFFF;
    --tab-syllabus:#00C853; --tab-syllabus-ink:#FFFFFF; --tab-syllabus-soft:#D1F4D7;
    --tab-logs:#FF9500; --tab-logs-ink:#FFFFFF; --tab-logs-soft:#FFE4CC;
    --tab-tiers:#7C3AED; --tab-tiers-ink:#FFFFFF; --tab-tiers-soft:#EDE9FE;
    --tab-mocks:#FF3B30; --tab-mocks-ink:#FFFFFF; --tab-mocks-soft:#FFCCCB;
    --tab-pyq:#34C759; --tab-pyq-ink:#FFFFFF; --tab-pyq-soft:#D1F4D7;
    --tab-quotes:#5856D6; --tab-quotes-ink:#FFFFFF; --tab-quotes-soft:#E8E5FF;
    --tab-accent: var(--tab-dashboard); --tab-accent-ink: var(--tab-dashboard-ink); --tab-accent-soft: var(--tab-dashboard-soft);
    --shadow: 0 1px 2px rgba(22,27,46,.06), 0 6px 20px -8px rgba(22,27,46,.18);
    --radius: 14px;
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono:'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F111B; --surface:#1A1D2E; --surface-2:#20233A; --raised:#232744;
      --ink:#F5F5F7; --ink-soft:#C5C9D9; --ink-faint:#8A8FAE;
      --line:#333A59; --line-soft:#282D48;
      --navy:#8DA0E8; --navy-ink:#141833; --navy-soft:#232B4D;
      --gold:#D9B25E; --gold-ink:#241D0B; --gold-soft:#332A16;
      --sage:#5FC79A; --sage-ink:#0E2A1F; --sage-soft:#1B3A2C;
      --brick:#E4897E; --brick-ink:#331512; --brick-soft:#3A211E;
      --tier4:#8189B0; --tier4-soft:#242945; --link:#D9B25E;
      --freq1:#FF6B5B; --freq1-soft:#3D211E;
      --freq2:#FFA94D; --freq2-soft:#3B2A17;
      --freq3:#E8C547; --freq3-soft:#382E15;
      --freq4:#7B8099; --freq4-soft:#242844;
      --tab-dashboard:#8FB0EE; --tab-dashboard-ink:#141833; --tab-dashboard-soft:#22304F;
      --tab-syllabus:#6FCFC2; --tab-syllabus-ink:#0E2A26; --tab-syllabus-soft:#1B3733;
      --tab-logs:#E3A768; --tab-logs-ink:#2B1B08; --tab-logs-soft:#3A2C17;
      --tab-tiers:#B79CE8; --tab-tiers-ink:#241B38; --tab-tiers-soft:#2E2748;
      --tab-mocks:#E38C9B; --tab-mocks-ink:#331A1F; --tab-mocks-soft:#3A2429;
      --tab-pyq:#9CC46E; --tab-pyq-ink:#1B2A12; --tab-pyq-soft:#26361B;
      --tab-quotes:#9CAAD9; --tab-quotes-ink:#181E33; --tab-quotes-soft:#242B45;
      --tab-accent: var(--tab-dashboard); --tab-accent-ink: var(--tab-dashboard-ink); --tab-accent-soft: var(--tab-dashboard-soft);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F111B; --surface:#1A1D2E; --surface-2:#20233A; --raised:#232744;
    --ink:#E8EAF6; --ink-soft:#A7ACC9; --ink-faint:#6E7392;
    --line:#333A59; --line-soft:#282D48;
    --navy:#8DA0E8; --navy-ink:#141833; --navy-soft:#232B4D;
    --gold:#D9B25E; --gold-ink:#241D0B; --gold-soft:#332A16;
    --sage:#5FC79A; --sage-ink:#0E2A1F; --sage-soft:#1B3A2C;
    --brick:#E4897E; --brick-ink:#331512; --brick-soft:#3A211E;
    --tier4:#8189B0; --tier4-soft:#242945; --link:#D9B25E;
    --freq1:#FF6B5B; --freq1-soft:#3D211E;
    --freq2:#FFA94D; --freq2-soft:#3B2A17;
    --freq3:#E8C547; --freq3-soft:#382E15;
    --freq4:#7B8099; --freq4-soft:#242844;
    --tab-dashboard:#8FB0EE; --tab-dashboard-ink:#141833; --tab-dashboard-soft:#22304F;
    --tab-syllabus:#6FCFC2; --tab-syllabus-ink:#0E2A26; --tab-syllabus-soft:#1B3733;
    --tab-logs:#E3A768; --tab-logs-ink:#2B1B08; --tab-logs-soft:#3A2C17;
    --tab-tiers:#B79CE8; --tab-tiers-ink:#241B38; --tab-tiers-soft:#2E2748;
    --tab-mocks:#E38C9B; --tab-mocks-ink:#331A1F; --tab-mocks-soft:#3A2429;
    --tab-pyq:#9CC46E; --tab-pyq-ink:#1B2A12; --tab-pyq-soft:#26361B;
    --tab-quotes:#9CAAD9; --tab-quotes-ink:#181E33; --tab-quotes-soft:#242B45;
    --tab-accent: var(--tab-dashboard); --tab-accent-ink: var(--tab-dashboard-ink); --tab-accent-soft: var(--tab-dashboard-soft);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.55);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-display); font-weight:600; margin:0; text-wrap:balance;}
  button{font:inherit; color:inherit;}
  :focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important; scroll-behavior:auto!important;} }
  input,textarea,select{font:inherit; color:inherit;}
  .num{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}

  #app{max-width:760px; margin:0 auto; min-height:100%;}

  /* ---- Top bar ----
     #chrome sticks flush at top:0 (not offset by the notch) so its background
     covers the full width including behind the status bar; #topbar itself adds
     the safe-area padding so its CONTENT clears the notch instead. The previous
     top:env(safe-area-inset-top) left that notch strip uncovered, so scrolled
     page content showed through above the header. */
  #chrome{position:sticky; top:0; z-index:20;}
  #topbar{
    background:linear-gradient(120deg, #4F6DF5, #A855F7, #EC4899, #F97316, #4F6DF5);
    background-size:300% 300%;
    animation:topbarGlow 14s ease-in-out infinite;
    color:#FFFFFF;
    padding:calc(14px + env(safe-area-inset-top,0px)) 18px 16px;
    border-bottom:4px solid var(--tab-accent);
    transition:border-color .2s;
  }
  @keyframes topbarGlow{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  @media (prefers-reduced-motion: reduce){ #topbar{animation:none; background-position:0% 50%;} }
  #topbar .row{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; text-align:center; position:relative;}
  #topbar .brand{font-family:var(--font-display); font-size:21px; font-weight:600; letter-spacing:.2px; text-shadow:0 1px 4px rgba(0,0,0,.18);}
  #topbar .brand small{display:block; font-family:var(--font-body); font-weight:600; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; opacity:.85; margin-top:3px;}
  #topbar .today{font-family:var(--font-mono); font-size:11px; opacity:.85; position:absolute; top:0; right:0;}
  #themeToggle{position:absolute; top:50%; left:18px; transform:translateY(-50%); appearance:none; background:none; border:none; cursor:pointer; padding:0; margin:0; width:50px; height:28px; border-radius:999px; background:rgba(255,255,255,.25); position:relative; transition:background .3s; display:flex; align-items:center; padding:2px;}
  #themeToggle::before{content:''; position:absolute; width:24px; height:24px; background:rgba(255,255,255,.95); border-radius:50%; transition:left .3s cubic-bezier(.4,.0,.2,1); left:2px; box-shadow:0 2px 6px rgba(0,0,0,.25);}
  html[data-theme="light"] #themeToggle{background:rgba(255,255,255,.3);}
  html[data-theme="light"] #themeToggle::before{left:2px;}
  :root:not([data-theme="light"]) #themeToggle{background:rgba(255,255,255,.2);}
  :root:not([data-theme="light"]) #themeToggle::before{left:24px;}
  #themeToggle:active{transform:translateY(-50%) scale(1.1);}

  /* ---- Tab strip ---- */
  #tabs{
    display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch;
    background:var(--bg); padding:10px 14px; border-bottom:1px solid var(--line);
    scrollbar-width:none;
  }
  #tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto; padding:8px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-soft); font-size:13px; font-weight:600;
    cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:7px;
    transition:background .15s, color .15s, border-color .15s;
  }
  .tab .dot{width:6px; height:6px; border-radius:50%; background:var(--ink-faint);}
  .tab.active{background:var(--tab-accent); color:var(--tab-accent-ink); border-color:var(--tab-accent); transition:background .2s, border-color .2s;}
  .tab.active .dot{background:var(--tab-accent-ink); opacity:.55;}

  #subtabs{
    display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch;
    background:var(--bg); padding:0 14px 10px; border-bottom:1px solid var(--line);
    scrollbar-width:none;
  }
  #subtabs::-webkit-scrollbar{display:none;}
  #subtabs:empty{display:none;}
  .subtab{
    flex:0 0 auto; padding:6px 13px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink-soft); font-size:12px; font-weight:600;
    cursor:pointer; white-space:nowrap; transition:background .2s, color .2s, border-color .2s;
  }
  .subtab.active{background:var(--tab-accent-soft); color:var(--tab-accent); border-color:var(--tab-accent);}

  main{padding:18px 16px 64px;}
  .view{display:none;}
  .view.active{display:block;}

  /* ---- Cards / shared ---- */
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
  .section-title{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--tab-accent); margin:26px 2px 10px; transition:color .2s;}
  .section-title:first-child{margin-top:0;}
  .muted{color:var(--ink-soft);}
  .chip{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:.02em;}
  .chip.tier1{background:var(--navy-soft); color:var(--navy);}
  .chip.tier2{background:var(--gold-soft); color:var(--gold);}
  .chip.tier3{background:var(--sage-soft); color:var(--sage);}
  .chip.tier4{background:var(--tier4-soft); color:var(--tier4);}
  .chip.tag-exam{background:var(--brick-soft); color:var(--brick);}
  .chip.tag-off{background:var(--tier4-soft); color:var(--tier4);}

  /* ---- Dashboard: glass cards with soft color fills ---- */
  #view-dashboard .card{
    position:relative;
    backdrop-filter:blur(16px) saturate(160%); -webkit-backdrop-filter:blur(16px) saturate(160%);
  }
  #view-dashboard .timer-card{
    position:relative; background:#010207; border-color:rgba(0,0,0,.5);
    overflow:hidden; isolation:isolate;
  }
  #view-dashboard .black-hole-scene{
    position:absolute; inset:0; width:100%; height:100%; z-index:0;
    display:block; pointer-events:none; background:#010207;
  }
  #view-dashboard .timer-card > *{position:relative; z-index:2;}
  #view-dashboard .hero{ background:color-mix(in srgb, var(--surface) 66%, var(--gold) 16%); border-color:color-mix(in srgb, var(--gold) 32%, var(--line)); }
  #view-dashboard .plan-card{ background:color-mix(in srgb, var(--surface) 68%, var(--sage) 14%); border-color:color-mix(in srgb, var(--sage) 30%, var(--line)); }
  #view-dashboard .plan-setup, #view-dashboard .result-card, #view-dashboard .backup-card{ background:color-mix(in srgb, var(--surface) 68%, var(--tab-accent) 16%); border-color:color-mix(in srgb, var(--tab-accent) 30%, var(--line)); }
  #view-dashboard .progress-card{ background:color-mix(in srgb, var(--surface) 72%, var(--card-tint, var(--navy)) 18%); border-color:color-mix(in srgb, var(--card-tint, var(--navy)) 26%, var(--line)); }

  /* ---- Dashboard ---- */
  .timer-card{margin-bottom:14px; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .timer-head{
    position:absolute; top:10px; right:12px; z-index:10;
    font-family:var(--font-mono); font-size:11px; font-weight:600;
    color:rgba(255,255,255,.82); text-shadow:0 1px 3px rgba(0,0,0,.8);
    pointer-events:none;
  }
  .timer-today{font-family:inherit; font-weight:600; text-transform:none; letter-spacing:0; color:inherit; font-size:inherit;}
  .timer-btns{
    position:absolute; left:12px; right:12px; bottom:10px; z-index:10;
    display:flex; gap:10px; justify-content:center; margin:0; padding:0;
  }
  .timer-btn{flex:1; max-width:140px; padding:11px; border-radius:10px; border:1px solid var(--line); background:rgba(0,0,0,.48); backdrop-filter:blur(7px); font-weight:700; font-size:13.5px; cursor:pointer; color:#fff;}
  .timer-btn.primary{background:rgba(31,42,82,.9); color:#fff; border-color:rgba(255,255,255,.25);}
  .timer-btn:disabled{opacity:.45; cursor:not-allowed;}

  /* ---- Timer dial (Black hole in galaxy field) ----
     Timer circle sits perfectly centered inside the black hole. */
  .timer-dial-wrap{
    position:relative; width:240px; height:100px; margin:0 auto; cursor:pointer;
    -webkit-tap-highlight-color:transparent; user-select:none; z-index:5;
    display:flex; align-items:center; justify-content:center;
  }
  .timer-dial-wrap:focus-visible{outline:none;}
  .timer-dial-glow,.timer-dial-ring,.timer-dial-orbit{display:none!important;}
  .timer-dial-face{position:relative;inset:auto;border:0;background:transparent;display:flex;align-items:center;justify-content:center;width:100%;height:100%;}
  .timer-display{font-family:var(--font-mono);font-size:32px;font-weight:800;letter-spacing:.04em;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.95),0 0 18px rgba(255,150,55,.28);}
