name: Deploy site (page/ as root)

on:
  push:
    branches: [main]
    paths: ["upsc-pyq-bank/page/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Built by hand (not upload-pages-artifact) so dot-folders like .well-known/ are kept.
      - name: Package page/ as the Pages artifact
        run: tar --dereference --hard-dereference -cf "$RUNNER_TEMP/artifact.tar" -C upsc-pyq-bank/page .
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      # GitHub sometimes cannot see the artifact for a few seconds after the upload ("Fetching artifact
      # metadata failed"). Waiting briefly and trying the deploy a second time within the same run avoids
      # the failure. Do not use "Re-run failed jobs" for this workflow: it uploads a second artifact and
      # the deploy then refuses ("Multiple artifacts named github-pages"). Start a fresh run instead.
      - name: Give GitHub a moment to register the artifact
        run: sleep 20
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before the second deploy attempt
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
